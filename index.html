<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Reversa: say the word backwards.">
  <!-- Link previews (WhatsApp, iMessage, Telegram) read these; the image needs an absolute URL. -->
  <meta property="og:title" content="Reversa">
  <meta property="og:description" content="Reversa: say the word backwards.">
  <meta property="og:image" content="https://frsgoncal.github.io/icons/Icon-maskable-512.png">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Reversa">
  <!-- The full square: iOS rounds the corners and fills transparency with black. -->
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Reversa</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Old builds registered a service worker that kept serving stale code: drop it and its caches once.
    // b06d2e947625d9f8f0fa66022d328ceb16c221c1 becomes the commit in .github/workflows/web.yml, so a deploy skips the HTTP cache.
    (async () => {
      // A room link (?room=) or a challenge link (?day=&score=) on Android tries the app first; without it
      // Chrome comes back here with web=1.
      // shortcut: iPhones always get the web game; opening the iOS app needs Universal Links on the domain root.
      const q = new URLSearchParams(location.search);
      const path = q.get('room') ? 'join?room=' + encodeURIComponent(q.get('room'))
        : q.get('day') ? 'challenge?day=' + encodeURIComponent(q.get('day')) +
          '&score=' + encodeURIComponent(q.get('score') || '')
        : null;
      if (path && !q.has('web') && /Android/i.test(navigator.userAgent)) {
        const back = new URL(location.href);
        back.searchParams.set('web', '1');
        location.href = 'intent://app/' + path +
          '#Intent;scheme=reversa;S.browser_fallback_url=' + encodeURIComponent(back.href) + ';end';
        // If the browser blocked the jump, load the web game anyway.
        await new Promise((r) => setTimeout(r, 1500));
      }
      try {
        const sw = navigator.serviceWorker;
        if (sw) {
          const scope = new URL('.', document.baseURI).href;
          const regs = (await sw.getRegistrations()).filter((r) => r.scope === scope);
          await Promise.all(regs.map((r) => r.unregister()));
          if (window.caches) {
            const keys = (await caches.keys()).filter((k) => k.startsWith('flutter-'));
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
          // A controlled page may already run cached code; after the reload it is uncontrolled, so no loop.
          if (regs.length && sw.controller) return location.reload();
        }
      } catch (_) {}
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?b=b06d2e947625d9f8f0fa66022d328ceb16c221c1';
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
